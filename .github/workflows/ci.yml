name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js v22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run ESLint Linter Check
      run: npm run lint

    - name: Run Code Prettier Format Verification
      run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

    - name: Run Jest Unit Tests
      run: npm run test

    - name: Run Compile Build Check
      run: npm run build
